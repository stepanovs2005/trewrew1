<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>verge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05050a;color:#f0e9d6;font-family:ui-serif,'Cormorant Garamond','Times New Roman',serif;cursor:crosshair}
canvas{position:fixed;inset:0}
#bg{z-index:0}
#fx{z-index:1;mix-blend-mode:screen}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.ui{position:fixed;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:2rem;pointer-events:none}
.ui>div{max-width:92vw}
h1{
  font-size:clamp(4rem,16vw,12rem);font-weight:200;letter-spacing:.06em;line-height:1;
  display:inline-flex;gap:.02em;position:relative;
}
h1 span{
  display:inline-block;
  background:linear-gradient(140deg,#d4a574,#f0e9d6 40%,#b48c5a 70%,#7a5a9a);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:drop .9s cubic-bezier(.2,.8,.2,1) both,shimmer 8s ease-in-out infinite;
  text-shadow:0 0 40px rgba(212,165,116,.15);
}
h1 span:nth-child(1){animation-delay:0s,0s}
h1 span:nth-child(2){animation-delay:.08s,0s}
h1 span:nth-child(3){animation-delay:.16s,0s}
h1 span:nth-child(4){animation-delay:.24s,0s}
h1 span:nth-child(5){animation-delay:.32s,0s}
.sub{
  margin-top:2rem;font-style:italic;font-size:clamp(1rem,2.6vw,1.5rem);
  letter-spacing:.3em;color:rgba(240,233,214,.55);
  overflow:hidden;white-space:nowrap;border-right:1px solid rgba(240,233,214,.4);
  width:0;animation:type 3s steps(32,end) 1.2s forwards,blink 1s step-end infinite 1.2s;
  margin-left:auto;margin-right:auto;max-width:max-content;
}
.ring{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(80vmin,900px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(212,165,116,.08);
  box-shadow:inset 0 0 120px rgba(212,165,116,.08),0 0 80px rgba(122,90,154,.1);
  z-index:1;pointer-events:none;
  animation:spin 60s linear infinite;
}
.ring::before,.ring::after{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  border:1px dashed rgba(212,165,116,.1);
}
.ring::before{inset:-10%;animation:spin 90s linear infinite reverse}
.ring::after{inset:-22%;border-style:dotted;animation:spin 140s linear infinite}
.corners{position:fixed;inset:1.5rem;z-index:3;pointer-events:none;color:rgba(240,233,214,.3);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.72rem;letter-spacing:.2em}
.corners>div{position:absolute}
.tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}

@keyframes drop{from{opacity:0;transform:translateY(-.6em) rotate(-8deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes type{to{width:19ch}}
@keyframes blink{50%{border-color:transparent}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="ring"></div>
<div class="grain"></div>
<div class="corners">
  <div class="tl">◇ VERGE / 2026.11</div>
  <div class="tr">LAT 00.00 ⋅ LNG 00.00</div>
  <div class="bl">∞ steady</div>
  <div class="br">bench · loupe · presence</div>
</div>
<div class="ui"><div>
  <h1><span>v</span><span>e</span><span>r</span><span>g</span><span>e</span></h1>
  <div class="sub">the presence beside the loupe</div>
</div></div>
<script>
const BG=document.getElementById('bg'),FX=document.getElementById('fx');
const b=BG.getContext('2d'),f=FX.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function R(){W=innerWidth;H=innerHeight;for(const C of[BG,FX]){C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';C.getContext('2d').setTransform(DPR,0,0,DPR,0,0)}}
R();addEventListener('resize',R);

const mouse={x:-1e4,y:-1e4,active:false};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
addEventListener('pointerleave',()=>mouse.active=false);

// perlin-ish noise (value noise, cheap)
const P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=P[i+256]=(i*73+37)%256;
function n2(x,y){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255;
  x-=Math.floor(x);y-=Math.floor(y);
  const u=x*x*(3-2*x),v=y*y*(3-2*y);
  const a=P[X]+Y,ab=P[a]/255,aa=P[a+1]/255;
  const c=P[X+1]+Y,cb=P[c]/255,ca=P[c+1]/255;
  return (ab*(1-u)+cb*u)*(1-v)+(aa*(1-u)+ca*u)*v;
}

// particles following curl of noise field
const N=Math.min(260,Math.floor(W*H/9000));
const parts=[];
for(let i=0;i<N;i++)parts.push({
  x:Math.random()*W,y:Math.random()*H,
  vx:0,vy:0,
  life:Math.random()*300+100,age:Math.random()*300,
  hue:Math.random()<.5?30:270+Math.random()*30,
  sat:40+Math.random()*30
});

// nebula backdrop blobs
const blobs=[
  {x:.22,y:.28,r:.5,c:[212,165,116]},
  {x:.78,y:.72,r:.55,c:[122,90,154]},
  {x:.5,y:.5,r:.45,c:[140,110,80]},
  {x:.8,y:.2,r:.35,c:[90,80,140]},
];

let t=0;

function drawBG(){
  // base deep gradient
  const g=b.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,Math.max(W,H)*.7);
  g.addColorStop(0,'#0a0820');g.addColorStop(.6,'#060510');g.addColorStop(1,'#030308');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  // slow drifting blobs
  for(const o of blobs){
    const ox=o.x*W+Math.sin(t*.0003+o.x*7)*120;
    const oy=o.y*H+Math.cos(t*.0004+o.y*9)*100;
    const rr=o.r*Math.min(W,H)*(1+.1*Math.sin(t*.0008+o.x*3));
    const rg=b.createRadialGradient(ox,oy,0,ox,oy,rr);
    rg.addColorStop(0,`rgba(${o.c[0]},${o.c[1]},${o.c[2]},.22)`);
    rg.addColorStop(1,`rgba(${o.c[0]},${o.c[1]},${o.c[2]},0)`);
    b.fillStyle=rg;b.fillRect(0,0,W,H);
  }
  // soft horizon streaks
  for(let i=0;i<40;i++){
    const y=H*.5+Math.sin(t*.002+i*.3)*H*.3;
    const a=.015+.01*Math.sin(t*.003+i);
    b.fillStyle=`rgba(212,165,116,${a})`;
    b.fillRect(0,y,W,.6);
  }
}

function step(){
  t++;
  drawBG();
  // fade fx layer
  f.globalCompositeOperation='destination-out';
  f.fillStyle='rgba(0,0,0,.055)';f.fillRect(0,0,W,H);
  f.globalCompositeOperation='lighter';

  for(const p of parts){
    const nx=n2(p.x*.0022,p.y*.0022+t*.001);
    const ang=nx*Math.PI*4+t*.0008;
    p.vx+=Math.cos(ang)*.08;
    p.vy+=Math.sin(ang)*.08;

    // mouse attract
    if(mouse.active){
      const dx=mouse.x-p.x,dy=mouse.y-p.y,d2=dx*dx+dy*dy+800;
      p.vx+=dx/d2*60;p.vy+=dy/d2*60;
    }

    p.vx*=.93;p.vy*=.93;
    p.x+=p.vx;p.y+=p.vy;

    const life=p.age/p.life,fade=Math.sin(life*Math.PI);
    f.beginPath();f.arc(p.x,p.y,1.3,0,7);
    f.fillStyle=`hsla(${p.hue},${p.sat}%,65%,${.55*fade})`;
    f.fill();

    // halo
    f.beginPath();f.arc(p.x,p.y,5,0,7);
    f.fillStyle=`hsla(${p.hue},${p.sat}%,60%,${.08*fade})`;
    f.fill();

    p.age++;
    if(p.age>p.life||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20){
      p.x=Math.random()*W;p.y=Math.random()*H;
      p.vx=p.vy=0;p.age=0;p.life=Math.random()*300+150;
    }
  }

  // cursor glow
  if(mouse.active){
    const g=f.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,180);
    g.addColorStop(0,'rgba(212,165,116,.25)');g.addColorStop(1,'rgba(212,165,116,0)');
    f.fillStyle=g;f.fillRect(mouse.x-200,mouse.y-200,400,400);
  }

  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
